<svg width="1400" height="320" viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b42"/>
      <stop offset="45%" stop-color="#0c2a63"/>
      <stop offset="100%" stop-color="#2b6fe0"/>
    </linearGradient>

    <linearGradient id="bar-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>

    <mask id="bar-mask">
      <rect x="0" y="0" width="1400" height="320" fill="url(#bar-fade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="320" rx="16" fill="url(#bg-gradient)"/>

  <!-- Bar chart graphic, clipped to rounded corners -->
  <clipPath id="round-clip">
    <rect x="0" y="0" width="1400" height="320" rx="16"/>
  </clipPath>

  <g clip-path="url(#round-clip)" mask="url(#bar-mask)">
    <g fill="#bfe0ff" opacity="0.85">
      <rect x="480"  y="210" width="26" height="110"/>
      <rect x="516"  y="150" width="26" height="170"/>
      <rect x="552"  y="190" width="26" height="130"/>
      <rect x="588"  y="120" width="26" height="200"/>
      <rect x="624"  y="170" width="26" height="150"/>
      <rect x="660"  y="90"  width="26" height="230"/>
      <rect x="696"  y="140" width="26" height="180"/>
      <rect x="732"  y="60"  width="26" height="260"/>
      <rect x="768"  y="110" width="26" height="210"/>
      <rect x="804"  y="180" width="26" height="140"/>
      <rect x="840"  y="70"  width="26" height="250"/>
      <rect x="876"  y="130" width="26" height="190"/>
      <rect x="912"  y="40"  width="26" height="280"/>
      <rect x="948"  y="100" width="26" height="220"/>
      <rect x="984"  y="160" width="26" height="160"/>
      <rect x="1020" y="80"  width="26" height="240"/>
      <rect x="1056" y="150" width="26" height="170"/>
      <rect x="1092" y="50"  width="26" height="270"/>
      <rect x="1128" y="120" width="26" height="200"/>
      <rect x="1164" y="180" width="26" height="140"/>
      <rect x="1200" y="90"  width="26" height="230"/>
      <rect x="1236" y="160" width="26" height="160"/>
      <rect x="1272" y="110" width="26" height="210"/>
      <rect x="1308" y="170" width="26" height="150"/>
      <rect x="1344" y="130" width="26" height="190"/>
    </g>

    <!-- faint dotted grid overlay for texture -->
    <g fill="#ffffff" opacity="0.12">
      <circle cx="500" cy="60" r="2"/><circle cx="540" cy="60" r="2"/><circle cx="580" cy="60" r="2"/>
      <circle cx="620" cy="60" r="2"/><circle cx="660" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
      <circle cx="740" cy="60" r="2"/><circle cx="780" cy="60" r="2"/><circle cx="820" cy="60" r="2"/>
      <circle cx="500" cy="30" r="2"/><circle cx="540" cy="30" r="2"/><circle cx="580" cy="30" r="2"/>
      <circle cx="620" cy="30" r="2"/><circle cx="660" cy="30" r="2"/><circle cx="700" cy="30" r="2"/>
      <circle cx="740" cy="30" r="2"/><circle cx="780" cy="30" r="2"/><circle cx="820" cy="30" r="2"/>
    </g>

    <!-- callout number, subtle, like the "78%" in the reference -->
    <text x="1250" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" opacity="0.18">78%</text>
  </g>

  <!-- diagonal light streaks for depth -->
  <g opacity="0.06" fill="#ffffff">
    <polygon points="0,0 120,0 40,320 -60,320"/>
    <polygon points="180,0 260,0 180,320 100,320"/>
  </g>
</svg>
